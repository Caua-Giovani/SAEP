<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>CADASTRO DE RESPONSAVEL</h1>
    <form action="/responsavel" method="post">
        <p>NOME</p>
        <input type="text" name="nome">
        <p>CPF</p>
        <input type="text" name="cpf">
        <button type="submit">CADASTRAR</button>
    </form>

    <h1>BUSCAR RESPONSAVEL</h1>
    <form action="/responsavel" method="get">
        <p>Buscar por nome</p>
        <input type="text" name="busca">
        <button type="submit">Buscar</button>
    </form>

    <h1>RESPONSAVEIS CADASTRADOS</h1>
    <table>
        <tr>
            <th>ID RESPONSAVEL</th>
            <th>CPF</th>
            <th>NOME</th>
            <th>BOTÕES</th>
        </tr>
        {% for responsavel in responsaveis %}
        <tr>
            <form action="/alterar_responsavel" method="post">
                <td>
                    <input type="text" name="id_responsavel_alt" value="{{responsavel.id_responsavel}}">
                </td>
                <td>
                    <input type="text" name="cpf_alt" value="{{responsavel.cpf}}">
                </td>
                <td>
                    <input type="text" name="nome_alt" value="{{responsavel.nome}}">
                </td>
                <td>
                    <a href="/excluir_responsavel/{{responsavel.id_responsavel}}">EXCLUIR</a>
                    <button type="submit">ALTERAR</button>
                </td>
            </form>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
